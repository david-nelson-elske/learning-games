<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tank Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: one screen, a glowing battlefield in the middle, the sum on top, big buttons below. Dark by design. */
  :root {
    --bg: #071012;
    --field: #0c1a1c;
    --ink: #e6fffb;
    --dim: #7fb8b1;
    --teal: #2dd4bf;
    --cyan: #22d3ee;
    --hi: #ccfbf1;
    --warn: #fbbf24;
    --display: "Russo One", "Arial Black", Impact, sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; overflow: hidden;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3.2vw, 34px); margin: 0; letter-spacing: 1px;
    color: var(--teal); text-shadow: 0 0 14px rgba(45, 212, 191, .55); text-wrap: balance; }
  .task { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .task-text { font-weight: 800; font-size: clamp(15px, 2vw, 20px); background: rgba(45, 212, 191, .1);
    border: 1px solid rgba(45, 212, 191, .4); border-radius: 999px; padding: 6px 14px; min-width: 0; }
  .task-text.done { border-color: var(--warn); color: var(--warn); background: rgba(251, 191, 36, .1); }
  .stars { font-family: var(--display); color: var(--warn); font-size: 20px; font-variant-numeric: tabular-nums; }
  #stage { position: relative; flex: 1; min-height: 320px; border-radius: 18px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 60%, #0f2a2b 0%, var(--field) 55%, var(--bg) 100%); }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .sum { position: absolute; top: 10px; left: 0; right: 0; text-align: center; pointer-events: none;
    font-family: var(--display); font-size: clamp(30px, 6vw, 64px); color: var(--hi); letter-spacing: 2px;
    text-shadow: 0 0 18px rgba(45, 212, 191, .8); font-variant-numeric: tabular-nums; }
  .sum .op { color: var(--teal); }
  .say { position: absolute; top: clamp(48px, 7.5vw, 84px); left: 0; right: 0; text-align: center; pointer-events: none;
    font-weight: 800; font-size: clamp(15px, 2.2vw, 22px); color: var(--dim); min-height: 1.4em; }
  .count { position: absolute; transform: translate(-50%, -100%); pointer-events: none; font-family: var(--display);
    font-size: clamp(36px, 6vw, 72px); color: var(--teal); text-shadow: 0 0 20px rgba(45, 212, 191, .9);
    font-variant-numeric: tabular-nums; }
  .rel { position: absolute; transform: translate(-50%, -100%); pointer-events: none; font-family: var(--display);
    font-size: clamp(30px, 5vw, 60px); color: var(--hi); text-shadow: 0 0 18px rgba(34, 211, 238, .9); }
  .rel.equal { color: var(--warn); text-shadow: 0 0 22px rgba(251, 191, 36, .9); }
  .help { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; color: var(--dim); font-size: 13px;
    pointer-events: none; padding-inline: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  button { font-family: var(--display); font-size: clamp(15px, 2vw, 19px); color: var(--bg); background: var(--teal);
    border: 0; border-radius: 14px; padding: 12px 18px; cursor: pointer; box-shadow: 0 0 18px rgba(45, 212, 191, .45);
    min-height: 48px; }
  button.alt { background: transparent; color: var(--teal); border: 2px solid var(--teal); box-shadow: none; }
  button.fire { background: var(--warn); box-shadow: 0 0 18px rgba(251, 191, 36, .5); }
  button:focus-visible { outline: 3px solid var(--hi); outline-offset: 3px; }
  button:active { transform: translateY(2px); }
  @media (max-width: 520px) { button { padding: 10px 12px; } .help { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Tank Maths</h1>
  <div class="task">
    <span class="task-text" id="task">Make both sides equal</span>
    <span class="stars" id="stars" aria-label="stars">★ 0</span>
  </div>
</header>

<div id="stage" aria-label="Two groups of battle tanks. Build, blow up or drag tanks to change the numbers.">
  <div class="sum" id="sum"></div>
  <div class="say" id="say" aria-live="polite"></div>
  <div class="count" id="countL">0</div>
  <div class="rel" id="rel">=</div>
  <div class="count" id="countR">0</div>
  <div class="help">Tap a tank to blow it up. Drag a tank to the other side. Build adds one.</div>
</div>

<div class="controls">
  <button id="buildL" type="button">+ Build left</button>
  <button id="buildR" type="button">+ Build right</button>
  <button id="fire" class="fire" type="button">Fire!</button>
  <button id="next" class="alt" type="button">New challenge</button>
  <button id="clear" class="alt" type="button">Clear</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const MAX = 10;
  const TEAL = 0x2dd4bf, CYAN = 0x22d3ee, HI = 0xccfbf1, GOLD = 0xfbbf24;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');

  // ---------- three.js: an isometric orthographic view of two pads
  const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.shadowMap.enabled = true;
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
  camera.position.set(20, 20, 20);
  camera.lookAt(0, 0.4, 0);

  scene.add(new THREE.HemisphereLight(0x99f6e4, 0x041010, 0.65));
  scene.add(new THREE.AmbientLight(0x2dd4bf, 0.18));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(6, 14, 4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, {left: -10, right: 10, top: 10, bottom: -10});
  scene.add(sun);
  const flashLight = new THREE.PointLight(CYAN, 0, 8);
  scene.add(flashLight);

  // Screen right and screen up, on the ground.
  const U = new THREE.Vector3(1, 0, -1).normalize();
  const V = new THREE.Vector3(-1, 0, -1).normalize();
  const PADX = 3.3;
  const padCenter = (side) => U.clone().multiplyScalar(side === 0 ? -PADX : PADX);

  const bodyMat = new THREE.MeshStandardMaterial({color: 0x15403d, roughness: 0.55, metalness: 0.25, emissive: 0x031413});
  const darkMat = new THREE.MeshStandardMaterial({color: 0x0b2224, roughness: 0.8, metalness: 0.1});
  const litMat = new THREE.MeshBasicMaterial({color: TEAL});
  const hiMat = new THREE.MeshBasicMaterial({color: HI});
  const edgeMat = new THREE.LineBasicMaterial({color: TEAL, transparent: true, opacity: 0.55});

  const withEdges = (mesh, mat = edgeMat) => {
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 28), mat));
    mesh.castShadow = true;
    return mesh;
  };

  // The two pads: a plinth with a lit rim for each side.
  [0, 1].forEach((side) => {
    const g = new THREE.Group();
    g.position.copy(padCenter(side));
    const plinth = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.14, 5.9), darkMat);
    plinth.position.y = -0.07;
    plinth.receiveShadow = true;
    withEdges(plinth, new THREE.LineBasicMaterial({color: TEAL, transparent: true, opacity: 0.8}));
    g.add(plinth);
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(4.3, 6.6),
      new THREE.MeshBasicMaterial({color: TEAL, transparent: true, opacity: 0.07, depthWrite: false}));
    glow.rotation.x = -Math.PI / 2;
    glow.position.y = -0.15;
    g.add(glow);
    scene.add(g);
  });

  // ---------- A battle tank, built along +x
  function makeTank() {
    const g = new THREE.Group();
    const add = (geo, mat, x, y, z, rot) => {
      const m = withEdges(new THREE.Mesh(geo, mat));
      m.position.set(x, y, z);
      if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
      g.add(m);
      return m;
    };
    add(new THREE.BoxGeometry(1.32, 0.26, 0.26), darkMat, 0, 0.13, 0.36);
    add(new THREE.BoxGeometry(1.32, 0.26, 0.26), darkMat, 0, 0.13, -0.36);
    add(new THREE.BoxGeometry(1.12, 0.24, 0.62), bodyMat, 0.0, 0.36, 0);
    add(new THREE.BoxGeometry(0.26, 0.16, 0.6), bodyMat, 0.6, 0.31, 0, [0, 0, -0.65]);
    const turret = add(new THREE.CylinderGeometry(0.26, 0.31, 0.2, 20), bodyMat, -0.08, 0.58, 0);
    const gun = new THREE.Group();
    gun.position.set(0.12, 0.6, 0);
    const barrel = withEdges(new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.95, 12), bodyMat));
    barrel.rotation.z = -Math.PI / 2;
    barrel.position.x = 0.47;
    gun.add(barrel);
    const brake = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.13, 12), litMat);
    brake.rotation.z = -Math.PI / 2;
    brake.position.x = 0.98;
    gun.add(brake);
    g.add(gun);
    add(new THREE.CylinderGeometry(0.07, 0.07, 0.05, 12), bodyMat, -0.15, 0.7, 0.08);
    // the road wheels: lit hubs on both tracks
    for (let i = 0; i < 5; i++) {
      [0.5, -0.5].forEach((z) => {
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.02, 10), litMat);
        hub.rotation.x = Math.PI / 2;
        hub.position.set(-0.5 + i * 0.25, 0.13, z);
        g.add(hub);
      });
    }
    // a lit stripe along each side of the hull
    [0.312, -0.312].forEach((z) => {
      const s = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.03, 0.01), litMat);
      s.position.set(0, 0.42, z);
      g.add(s);
    });
    g.userData = {gun, turret, side: 0, target: new THREE.Vector3(), hop: 0};
    g.traverse((o) => { o.userData.tank = g; });
    return g;
  }

  // ---------- State: the tanks on each side, in order
  const sides = [[], []];
  let stars = 0;
  let task = null;
  let solvedAt = 0;

  function slot(side, i) {
    const col = i % 2, row = Math.floor(i / 2);
    return padCenter(side).add(new THREE.Vector3(col ? 0.8 : -0.8, 0, -2.3 + row * 1.15));
  }
  function relayout() {
    sides.forEach((list, side) => list.forEach((t, i) => { t.userData.side = side; t.userData.target.copy(slot(side, i)); }));
  }

  function addTank(side, from) {
    if (sides[side].length >= MAX) { say(`That side is full: ${MAX} is the most.`); return null; }
    const t = makeTank();
    sides[side].push(t);
    relayout();
    t.position.copy(from || t.userData.target.clone().add(new THREE.Vector3(-4, 0, 0)));
    t.userData.hop = from ? 0 : 1;
    scene.add(t);
    return t;
  }

  // ---------- Particles: squares of light for explosions and celebrations
  const parts = [];
  const partGeo = new THREE.BoxGeometry(0.09, 0.09, 0.09);
  function burst(pos, n, colors, speed = 4) {
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({color: colors[i % colors.length], transparent: true}));
      m.position.copy(pos);
      const a = Math.random() * Math.PI * 2, up = 1.5 + Math.random() * 3;
      m.userData = {v: new THREE.Vector3(Math.cos(a) * speed * Math.random(), up, Math.sin(a) * speed * Math.random()),
        life: 1, spin: new THREE.Vector3(Math.random() * 8, Math.random() * 8, Math.random() * 8)};
      scene.add(m);
      parts.push(m);
    }
  }
  // shells in flight, fired by Fire!
  const shells = [];

  // ---------- Sound: made in the page, after the first tap
  let ctx = null;
  const audio = () => { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) { ctx = null; } return ctx; };
  function boom(big = 1) {
    const c = audio(); if (!c) return;
    const len = 0.5 * big, buf = c.createBuffer(1, c.sampleRate * len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
    const src = c.createBufferSource(); src.buffer = buf;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    const g = c.createGain(); g.gain.value = 0.5 * big;
    src.connect(lp).connect(g).connect(c.destination); src.start();
  }
  function blip(f1, f2, len = 0.14) {
    const c = audio(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(f1, c.currentTime); o.frequency.exponentialRampToValueAtTime(f2, c.currentTime + len);
    g.gain.setValueAtTime(0.08, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + len);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + len);
  }
  const cheer = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, f * 1.01, 0.18), i * 110));

  // ---------- Words on screen
  let sayTimer = 0;
  function say(text, ms = 2600) {
    $('say').textContent = text;
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => { $('say').textContent = ''; }, ms);
  }
  function updateHud() {
    const L = sides[0].length, R = sides[1].length;
    $('sum').innerHTML = `${L} <span class="op">+</span> ${R} <span class="op">=</span> ${L + R}`;
    $('countL').textContent = L;
    $('countR').textContent = R;
    const rel = $('rel');
    rel.textContent = L === R ? '=' : L > R ? '>' : '<';
    rel.classList.toggle('equal', L === R);
    $('stars').textContent = `★ ${stars}`;
    checkTask();
  }

  // ---------- Challenges: easy questions he answers by building, blowing up and moving tanks
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const TASKS = [
    () => ({text: 'Make both sides equal', ok: (L, R) => L === R && L > 0, win: (L, R) => `Yes! ${L} = ${R}`}),
    () => { const n = rnd(2, 7); return {text: `Build ${n} tanks on the left`, ok: (L) => L === n, win: () => `Yes! ${n} tanks`}; },
    () => { const a = rnd(1, 5), b = rnd(1, 5); return {text: `Show ${a} + ${b}`, ok: (L, R) => L === a && R === b, win: () => `Yes! ${a} + ${b} = ${a + b}`}; },
    () => { const t = rnd(3, 10); return {text: `Make ${t} tanks in all`, ok: (L, R) => L + R === t, win: (L, R) => `Yes! ${L} + ${R} = ${t}`}; },
    () => { const n = rnd(1, 3); return {text: `Blow up tanks until the right side has ${n}`, setup: () => fill(1, n + rnd(2, 4)), ok: (L, R) => R === n,
      win: () => `Yes! Only ${n} left`}; },
    () => { const L0 = sides[0].length; const t = Math.max(2, L0); return {text: `Make the right side bigger than the left`, ok: (L, R) => R > L,
      win: (L, R) => `Yes! ${R} > ${L}`, _t: t}; },
  ];
  function fill(side, n) {
    while (sides[side].length > n) { const t = sides[side].pop(); scene.remove(t); }
    while (sides[side].length < n) addTank(side);
    relayout();
  }
  function newTask(first = false) {
    let next;
    do { next = TASKS[rnd(0, TASKS.length - 1)](); } while (!first && task && next.text === task.text);
    task = first ? TASKS[0]() : next;
    solvedAt = 0;
    if (task.setup) task.setup();
    $('task').textContent = task.text;
    $('task').classList.remove('done');
    updateHud();
  }
  function checkTask() {
    if (!task || solvedAt) return;
    const L = sides[0].length, R = sides[1].length;
    if (task.ok(L, R)) {
      solvedAt = performance.now();
      stars++;
      $('stars').textContent = `★ ${stars}`;
      $('task').textContent = task.win(L, R);
      $('task').classList.add('done');
      say('Press New challenge for another one.', 4000);
      cheer();
      [0, 1].forEach((s) => burst(padCenter(s).add(new THREE.Vector3(0, 1.2, 0)), reduced ? 10 : 40, [TEAL, CYAN, GOLD, HI], 5));
    }
  }

  // ---------- Input: tap to blow up, drag to move
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  let drag = null;
  function pick(e) {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
  }
  renderer.domElement.addEventListener('pointerdown', (e) => {
    audio();
    pick(e);
    const tanks = sides.flat();
    const hit = ray.intersectObjects(tanks, true)[0];
    if (!hit) return;
    const t = hit.object.userData.tank;
    drag = {t, x: e.clientX, y: e.clientY, moved: false, from: t.userData.side};
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener('pointermove', (e) => {
    pick(e);
    if (!drag) {
      const hit = ray.intersectObjects(sides.flat(), true)[0];
      renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
      return;
    }
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.moved = true;
    const p = new THREE.Vector3();
    if (ray.ray.intersectPlane(ground, p)) { drag.t.userData.target.copy(p); drag.t.userData.lift = 0.7; drag.at = p.clone(); }
  });
  renderer.domElement.addEventListener('pointerup', () => {
    if (!drag) return;
    const {t, moved, from, at} = drag;
    drag = null;
    t.userData.lift = 0;
    if (!moved) { explode(t); return; }
    const to = (at || t.position).dot(U) < 0 ? 0 : 1;
    if (to !== from && sides[to].length < MAX) {
      const L0 = sides[0].length, R0 = sides[1].length;
      sides[from].splice(sides[from].indexOf(t), 1);
      sides[to].push(t);
      relayout();
      const L = sides[0].length, R = sides[1].length;
      say(`${L0} + ${R0} = ${L} + ${R}. Still ${L + R} tanks!`, 3200);
      blip(330, 660);
    } else {
      relayout();
    }
    updateHud();
  });

  function explode(t) {
    const side = t.userData.side, before = sides[side].length;
    sides[side].splice(sides[side].indexOf(t), 1);
    scene.remove(t);
    burst(t.position.clone().add(new THREE.Vector3(0, 0.4, 0)), reduced ? 16 : 46, [TEAL, CYAN, HI, GOLD]);
    flashLight.position.copy(t.position).add(new THREE.Vector3(0, 1, 0));
    flashLight.intensity = 3;
    shake = reduced ? 0 : 0.25;
    boom(1);
    relayout();
    say(`${before} − 1 = ${before - 1}`);
    updateHud();
  }

  function build(side) {
    audio();
    const before = sides[side].length;
    if (addTank(side)) { blip(220, 440); say(`${before} + 1 = ${before + 1}`); updateHud(); }
  }

  function fire() {
    audio();
    const tanks = sides.flat();
    if (!tanks.length) { say('Build some tanks first!'); return; }
    tanks.forEach((t, i) => setTimeout(() => {
      if (!t.parent) return;
      const muzzle = new THREE.Vector3(1.1, 0.6, 0).applyMatrix4(t.matrixWorld);
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), hiMat);
      s.position.copy(muzzle);
      s.userData = {v: new THREE.Vector3(9, 2.2, 0), life: 1.2};
      scene.add(s);
      shells.push(s);
      burst(muzzle, reduced ? 4 : 10, [HI, GOLD], 1.2);
      t.userData.recoil = 1;
      boom(0.35);
    }, i * 90));
    say(`${tanks.length} tanks fire!`);
  }

  $('buildL').onclick = () => build(0);
  $('buildR').onclick = () => build(1);
  $('fire').onclick = fire;
  $('next').onclick = () => { audio(); newTask(); };
  $('clear').onclick = () => { fill(0, 0); fill(1, 0); say('All clear. Build some tanks!'); updateHud(); };

  // ---------- Resize: keep both pads in view at any width
  let shake = 0;
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    const aspect = w / h;
    // Both pads must fit across: a phone held upright needs more room on each side.
    const needW = aspect < 0.9 ? 7.4 : 6.4;
    let halfH = 4.3;
    if (halfH * aspect < needW) halfH = needW / aspect;
    Object.assign(camera, {left: -halfH * aspect, right: halfH * aspect, top: halfH + 1.1, bottom: -halfH + 0.3});
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // ---------- The loop
  const tmp = new THREE.Vector3();
  function place(el, worldPos) {
    tmp.copy(worldPos).project(camera);
    el.style.left = `${((tmp.x + 1) / 2) * stage.clientWidth}px`;
    el.style.top = `${((1 - tmp.y) / 2) * stage.clientHeight}px`;
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    sides.flat().forEach((t) => {
      const ud = t.userData;
      const goal = tmp.copy(ud.target); goal.y = (ud.lift || 0);
      t.position.lerp(goal, 1 - Math.pow(0.0008, dt));
      if (ud.recoil) { ud.recoil = Math.max(0, ud.recoil - dt * 4); ud.gun.position.x = 0.12 - 0.12 * ud.recoil; }
      const idle = Math.sin(now / 900 + t.id) * 0.06;
      ud.turret.rotation.y = idle; ud.gun.rotation.y = idle;
    });
    for (let i = parts.length - 1; i >= 0; i--) {
      const m = parts[i], u = m.userData;
      u.v.y -= 9 * dt; m.position.addScaledVector(u.v, dt);
      if (m.position.y < 0.05) { m.position.y = 0.05; u.v.multiplyScalar(0.4); u.v.y = Math.abs(u.v.y) * 0.3; }
      m.rotation.x += u.spin.x * dt; m.rotation.y += u.spin.y * dt;
      u.life -= dt * 0.8; m.material.opacity = Math.max(0, u.life);
      if (u.life <= 0) { scene.remove(m); m.material.dispose(); parts.splice(i, 1); }
    }
    for (let i = shells.length - 1; i >= 0; i--) {
      const s = shells[i], u = s.userData;
      u.v.y -= 6 * dt; s.position.addScaledVector(u.v, dt); u.life -= dt;
      if (s.position.y <= 0.05 || u.life <= 0) {
        burst(s.position.clone().setY(0.1), reduced ? 6 : 16, [TEAL, CYAN, GOLD], 2.5);
        scene.remove(s); shells.splice(i, 1);
      }
    }
    flashLight.intensity = Math.max(0, flashLight.intensity - dt * 9);
    shake = Math.max(0, shake - dt * 1.2);
    camera.position.set(20 + (Math.random() - 0.5) * shake, 20 + (Math.random() - 0.5) * shake, 20);
    renderer.render(scene, camera);
    place($('countL'), padCenter(0).add(new THREE.Vector3(-1.9, 1.0, -3.1)));
    place($('countR'), padCenter(1).add(new THREE.Vector3(-1.9, 1.0, -3.1)));
    place($('rel'), new THREE.Vector3(-1.9, 1.0, -3.1));
    requestAnimationFrame(frame);
  }

  // ---------- Start: 3 on the left and 2 on the right, so the first view already shows a sum
  function start(data) {
    const L = data && Number.isInteger(data.L) ? data.L : 3, R = data && Number.isInteger(data.R) ? data.R : 2;
    stars = data && Number.isInteger(data.stars) ? data.stars : 0;
    fill(0, L); fill(1, R);
    sides.flat().forEach((t) => t.position.copy(t.userData.target));
    newTask(true);
    requestAnimationFrame(frame);
  }
  start({});
})();
</script>
