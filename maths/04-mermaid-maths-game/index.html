<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mermaid Maths</title>
<!-- Made by the maths game factory in factory/ from the theme "mermaids". Edit the template or the theme, then run make.py. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: one screen, a glowing field in the middle, the sum on top, big buttons below. Dark by design.
     The theme sets the colours and fonts below. */
  :root {
    --bg: #060b1f;
    --field: #0b1636;
    --field-glow: #17306b;
    --ink: #f0f7ff;
    --dim: #9db4e0;
    --accent: #f472b6;
    --accent2: #67e8f9;
    --hi: #fdf2f8;
    --warn: #fde047;
    --display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    --accent-rgb: 244, 114, 182;
    --accent2-rgb: 103, 232, 249;
    --warn-rgb: 253, 224, 71;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body); margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; overflow: hidden;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3.2vw, 34px); margin: 0; letter-spacing: 1px;
    color: var(--accent); text-shadow: 0 0 14px rgba(var(--accent-rgb), .55); text-wrap: balance; }
  .task { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .task-text { font: inherit; font-weight: 800; font-size: clamp(15px, 2vw, 20px); color: var(--ink);
    background: rgba(var(--accent-rgb), .1); border: 1px solid rgba(var(--accent-rgb), .4); border-radius: 999px;
    padding: 6px 14px; min-width: 0; min-height: 0; box-shadow: none; cursor: pointer; text-align: left; }
  .task-text::before { content: "🔊 "; font-size: .85em; }
  .task-text.done { border-color: var(--warn); color: var(--warn); background: rgba(var(--warn-rgb), .1); }
  .stars { font-family: var(--display); color: var(--warn); font-size: 20px; font-variant-numeric: tabular-nums; }
  .mute { font-size: 20px; padding: 6px 10px; min-height: 40px; background: transparent; color: var(--accent);
    border: 2px solid rgba(var(--accent-rgb), .5); box-shadow: none; }
  #stage { position: relative; flex: 1; min-height: 320px; border-radius: 18px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 60%, var(--field-glow) 0%, var(--field) 55%, var(--bg) 100%); }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .sum { position: absolute; top: 10px; left: 0; right: 0; text-align: center; pointer-events: none;
    font-family: var(--display); font-size: clamp(30px, 6vw, 64px); color: var(--hi); letter-spacing: 2px;
    text-shadow: 0 0 18px rgba(var(--accent-rgb), .8); font-variant-numeric: tabular-nums; }
  .sum .op { color: var(--accent); }
  /* The words: the sum, or the line being read, in words. Each word lights up as the voice says it. */
  .words { position: absolute; top: calc(14px + clamp(30px, 6vw, 64px) * 1.15); left: 0; right: 0; text-align: center;
    pointer-events: none; font-weight: 800; font-size: clamp(18px, 2.8vw, 30px); line-height: 1.5; padding-inline: 12px;
    color: var(--ink); text-wrap: balance; }
  .words span { display: inline-block; padding: 0 .2em; margin: 0 .04em; border-radius: .35em; color: var(--dim);
    transition: color .12s, background-color .12s, transform .12s; }
  .words.resting span, .words span.said { color: var(--ink); }
  .words span.now { color: var(--bg); background: var(--warn); transform: scale(1.12);
    box-shadow: 0 0 16px rgba(var(--warn-rgb), .7); }
  .say { position: absolute; top: calc(18px + clamp(30px, 6vw, 64px) * 1.15 + clamp(18px, 2.8vw, 30px) * 1.6); left: 0; right: 0; text-align: center; pointer-events: none;
    font-weight: 800; font-size: clamp(15px, 2.2vw, 22px); color: var(--dim); min-height: 1.4em; }
  .count { position: absolute; transform: translate(-50%, -100%); pointer-events: none; font-family: var(--display);
    font-size: clamp(36px, 6vw, 72px); color: var(--accent); text-shadow: 0 0 20px rgba(var(--accent-rgb), .9);
    font-variant-numeric: tabular-nums; }
  .rel { position: absolute; transform: translate(-50%, -100%); pointer-events: none; font-family: var(--display);
    font-size: clamp(30px, 5vw, 60px); color: var(--hi); text-shadow: 0 0 18px rgba(var(--accent2-rgb), .9); }
  .rel.equal { color: var(--warn); text-shadow: 0 0 22px rgba(var(--warn-rgb), .9); }
  .help { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; color: var(--dim); font-size: 13px;
    pointer-events: none; padding-inline: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  button { font-family: var(--display); font-size: clamp(15px, 2vw, 19px); color: var(--bg); background: var(--accent);
    border: 0; border-radius: 14px; padding: 12px 18px; cursor: pointer; box-shadow: 0 0 18px rgba(var(--accent-rgb), .45);
    min-height: 48px; }
  button.alt { background: transparent; color: var(--accent); border: 2px solid var(--accent); box-shadow: none; }
  button.act { background: var(--warn); box-shadow: 0 0 18px rgba(var(--warn-rgb), .5); }
  button:focus-visible { outline: 3px solid var(--hi); outline-offset: 3px; }
  button:active { transform: translateY(2px); }
  @media (max-width: 520px) { button { padding: 10px 12px; } .help { display: none; } }
</style>

<body>
<header>
  <h1 id="title">Mermaid Maths</h1>
  <div class="task">
    <button class="task-text" id="task" type="button" title="Hear the challenge again"></button>
    <span class="stars" id="stars" aria-label="stars">★ 0</span>
    <button class="mute" id="mute" type="button" aria-label="Voice on" title="Voice on or off">🔊</button>
  </div>
</header>

<div id="stage" aria-label="Two pools of mermaids. Call, dive or drag mermaids to change the numbers.">
  <div class="sum" id="sum"></div>
  <div class="words resting" id="words" aria-hidden="true"></div>
  <div class="say" id="say" aria-live="polite"></div>
  <div class="count" id="countL">0</div>
  <div class="rel" id="rel">=</div>
  <div class="count" id="countR">0</div>
  <div class="help">Tap a mermaid and she dives. Drag a mermaid to the other pool. The + buttons call one more.</div>
</div>

<div class="controls">
  <button id="addL" type="button">+ Mermaid left</button>
  <button id="addR" type="button">+ Mermaid right</button>
  <button id="act" class="act" type="button">Splash!</button>
  <button id="next" class="alt" type="button">New challenge</button>
  <button id="clear" class="alt" type="button">Clear</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Words: every sentence a maths game shows and says.
 * The game page uses it to show and speak a line. make.py runs it in Node to list every line, so each one can be voiced.
 * Written for old JavaScript engines on purpose: no optional chaining, no modules. */
var WORDS = (function () {
  var NAMES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',
    'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'];
  var MAX = 10;
  // The numbers each challenge can ask for. The game picks from these, and make.py voices all of them.
  var RANGES = {build: [2, 7], show: [1, 5], total: [3, 10], keep: [1, 3]};

  // A theme can replace any of these. {things} is "tank" or "tanks" to match the number before it.
  var LINES = {
    sum: '{L} plus {R} equals {S}.',
    takeAway: '{a} take away {k} is {b}.',
    same: '{n} equals {n}.',
    count: '{n} {things}.',
    bigger: '{R} is bigger than {L}.',
    only: 'Only {n} left.',
    yes: ['Yes!', 'Well done!', 'You did it!'],
    next: 'Tap New challenge for another one.',
    full: 'That side is full. Ten is the most.',
    empty: 'Build some {many} first!',
    clear: 'All clear. Build some {many}!',
    act: '{Many}, fire!',
    taskEqual: 'Make both sides equal.',
    taskBuild: 'Build {n} {things} on the left.',
    taskShow: 'Show {a} plus {b}.',
    taskTotal: 'Make {t} {things} in all.',
    taskKeep: 'Blow up {many} until the right side has {n}.',
    taskBigger: 'Make the right side bigger than the left.'
  };
  // Lines that are maths: on screen they show symbols, "3 + 2 = 5", and drop the full stop.
  var MATH = {sum: 1, takeAway: 1, same: 1, bigger: 1, taskShow: 1};

  function tpl(theme, key, i) {
    var t = (theme.lines && theme.lines[key]) || LINES[key];
    return Array.isArray(t) ? t[(i || 0) % t.length] : t;
  }
  function fill(text, vars, theme, spoken) {
    var count = vars.n !== undefined ? vars.n : vars.t !== undefined ? vars.t : 2;
    return text.replace(/\{(\w+)\}/g, function (m, k) {
      if (k === 'things') return count === 1 ? theme.one : theme.many;
      if (k === 'many') return theme.many;
      if (k === 'Many') return theme.many.charAt(0).toUpperCase() + theme.many.slice(1);
      if (k === 'one') return theme.one;
      var v = vars[k];
      if (typeof v !== 'number') return m;
      return spoken ? NAMES[v] : String(v);
    });
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

  // One line: what the screen shows, what the voice says, and the name of its voice clip.
  function line(theme, key, vars, i) {
    var text = tpl(theme, key, i);
    var speak = cap(fill(text, vars || {}, theme, true));
    var show = fill(text, vars || {}, theme, false);
    if (MATH[key]) {
      show = show.replace(/ is bigger than /g, ' > ').replace(/ take away (\d+) is /g, ' − $1 = ')
        .replace(/ plus /g, ' + ').replace(/ equals /g, ' = ');
    }
    show = show.replace(/\.$/, '');
    return {show: show, speak: speak, clip: slug(speak)};
  }

  function range(r) { var out = []; for (var i = r[0]; i <= r[1]; i++) out.push(i); return out; }

  // Every line the game can say, for make.py to voice.
  function all(theme) {
    var out = [], seen = {};
    function add(l) { if (!seen[l.clip]) { seen[l.clip] = 1; out.push(l); } }
    var nums = range([0, MAX]);
    nums.forEach(function (L) { nums.forEach(function (R) { add(line(theme, 'sum', {L: L, R: R, S: L + R})); }); });
    range([1, MAX]).forEach(function (a) {
      range([1, a]).forEach(function (k) { add(line(theme, 'takeAway', {a: a, k: k, b: a - k})); });
      add(line(theme, 'same', {n: a}));
    });
    nums.forEach(function (L) { nums.forEach(function (R) { if (R > L) add(line(theme, 'bigger', {L: L, R: R})); }); });
    range(RANGES.build).forEach(function (n) { add(line(theme, 'taskBuild', {n: n})); add(line(theme, 'count', {n: n})); });
    range(RANGES.show).forEach(function (a) { range(RANGES.show).forEach(function (b) { add(line(theme, 'taskShow', {a: a, b: b})); }); });
    range(RANGES.total).forEach(function (t) { add(line(theme, 'taskTotal', {t: t})); });
    range(RANGES.keep).forEach(function (n) { add(line(theme, 'taskKeep', {n: n})); add(line(theme, 'only', {n: n})); });
    var yes = tpl(theme, 'yes', 0) === undefined ? [] : ((theme.lines && theme.lines.yes) || LINES.yes);
    yes.forEach(function (y, i) { add(line(theme, 'yes', {}, i)); });
    ['next', 'full', 'empty', 'clear', 'act', 'taskEqual', 'taskBigger'].forEach(function (k) { add(line(theme, k, {})); });
    return out;
  }

  return {NAMES: NAMES, MAX: MAX, RANGES: RANGES, LINES: LINES, line: line, all: all, slug: slug};
})();
if (typeof module !== 'undefined') module.exports = WORDS;
</script>
<script>
/* Theme: mermaids in two pools. Tap one and she dives below the surface; Splash! sends water across to the other pool. */
var THEME = {
  id: 'mermaids',
  folder: 'maths/04-mermaid-maths-game',
  title: 'Mermaid Maths',
  one: 'mermaid',
  many: 'mermaids',
  buttons: {addLeft: '+ Mermaid left', addRight: '+ Mermaid right', act: 'Splash!'},
  help: 'Tap a mermaid and she dives. Drag a mermaid to the other pool. The + buttons call one more.',
  stageLabel: 'Two pools of mermaids. Call, dive or drag mermaids to change the numbers.',
  fonts: 'family=Fredoka:wght@500;600&family=Nunito:wght@600;800',
  colors: {
    bg: '#060b1f', field: '#0b1636', fieldGlow: '#17306b', ink: '#f0f7ff', dim: '#9db4e0',
    accent: '#f472b6', accent2: '#67e8f9', hi: '#fdf2f8', warn: '#fde047', sky: '#bae6fd',
    display: '"Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif', body: '"Nunito", "Segoe UI", system-ui, sans-serif'
  },
  chime: 'triangle',
  lines: {
    taskBuild: 'Bring {n} {things} to the left.',
    taskKeep: 'Make {many} dive until the right side has {n}.',
    empty: 'Call some {many} first!',
    clear: 'All clear. Call some {many}!',
    act: '{Many}, splash!'
  },

  build: function (THREE, kit) {
    var C = kit.C;
    var SKIN = [0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524, 0xffdbac];
    var HAIR = [0xf472b6, 0xa78bfa, 0xfbbf24, 0xb45309, 0x312e81, 0xfde68a];
    var TAIL = [0x2dd4bf, 0xa855f7, 0xec4899, 0x38bdf8, 0x34d399, 0xf97316];
    var mats = {};
    function mat(color, glow) {
      var k = color + ':' + (glow || 0);
      if (!mats[k]) {
        mats[k] = new THREE.MeshStandardMaterial({color: color, roughness: 0.45, metalness: 0.1,
          emissive: color, emissiveIntensity: glow || 0.08});
      }
      return mats[k];
    }
    var aquaMat = new THREE.MeshBasicMaterial({color: C.accent2});
    var eyeMat = new THREE.MeshBasicMaterial({color: 0x1e1b4b});
    var dropGeo = new THREE.SphereGeometry(0.06, 8, 6);
    var dropMat = new THREE.MeshBasicMaterial({color: 0xbff4ff});
    var sparkGeo = new THREE.PlaneGeometry(0.08, 0.08);
    // the tail fin: two rounded lobes, flat
    var finShape = new THREE.Shape();
    finShape.moveTo(0, 0);
    finShape.quadraticCurveTo(-0.08, 0.1, -0.27, 0.3);
    finShape.quadraticCurveTo(-0.12, 0.28, 0, 0.17);
    finShape.quadraticCurveTo(0.12, 0.28, 0.27, 0.3);
    finShape.quadraticCurveTo(0.08, 0.1, 0, 0);
    var finGeo = new THREE.ExtrudeGeometry(finShape, {depth: 0.03, bevelEnabled: false});
    finGeo.translate(0, 0, -0.015);

    // A pool: a dark basin, a lit rim, and see-through water at height 0.
    function ground() {
      var g = new THREE.Group();
      var basin = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.6, 5.9), new THREE.MeshStandardMaterial({color: 0x0a1f4d, roughness: 0.9}));
      basin.position.y = -0.36;
      basin.receiveShadow = true;
      g.add(basin);
      var rimMat = new THREE.MeshStandardMaterial({color: 0x1d3a7a, roughness: 0.6});
      var rimLine = new THREE.LineBasicMaterial({color: C.accent2, transparent: true, opacity: 0.85});
      // the rim: two long sides and two short ends
      [[0.12, 6.02, 1.85, 0], [0.12, 6.02, -1.85, 0], [3.82, 0.12, 0, 2.95], [3.82, 0.12, 0, -2.95]].forEach(function (r) {
        var m = kit.withEdges(new THREE.Mesh(new THREE.BoxGeometry(r[0], 0.12, r[1]), rimMat), rimLine);
        m.position.set(r[2], 0.0, r[3]);
        g.add(m);
      });
      var water = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 5.9), new THREE.MeshStandardMaterial({
        color: 0x1d5fb8, transparent: true, opacity: 0.42, roughness: 0.15, metalness: 0.2,
        emissive: 0x0b3a7a, emissiveIntensity: 0.6, depthWrite: false}));
      water.rotation.x = -Math.PI / 2;
      water.position.y = 0.0;
      water.renderOrder = 2;
      g.add(water);
      // sparkles on the water that come and go
      var sparks = [];
      for (var i = 0; i < 14; i++) {
        var s = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({color: i % 3 ? 0xe0fbff : C.accent, transparent: true, opacity: 0, depthWrite: false}));
        s.rotation.x = -Math.PI / 2;
        s.rotation.z = Math.PI / 4;
        s.position.set((Math.random() - 0.5) * 3.2, 0.02, (Math.random() - 0.5) * 5.4);
        s.userData.phase = Math.random() * Math.PI * 2;
        s.renderOrder = 3;
        g.add(s);
        sparks.push(s);
      }
      var glow = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 6.7),
        new THREE.MeshBasicMaterial({color: C.accent2, transparent: true, opacity: 0.08, depthWrite: false}));
      glow.rotation.x = -Math.PI / 2;
      glow.position.y = -0.66;
      g.add(glow);
      g.userData.sparks = sparks;
      return g;
    }
    function groundIdle(g, now) {
      g.userData.sparks.forEach(function (s) {
        s.material.opacity = Math.max(0, Math.sin(now / 600 + s.userData.phase)) * 0.9;
      });
    }

    // A mermaid facing +x, her waist at the water line. Each one gets her own colours.
    function make(i) {
      var g = new THREE.Group();
      var rig = new THREE.Group();
      g.add(rig);
      var skin = mat(SKIN[(i * 3) % SKIN.length]);
      var hair = mat(HAIR[(i * 5 + 1) % HAIR.length]);
      var tail = mat(TAIL[(i * 7 + 2) % TAIL.length], 0.2);
      function put(geo, m, x, y, z, parent) {
        var mesh = new THREE.Mesh(geo, m);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        (parent || rig).add(mesh);
        return mesh;
      }
      // the tail: a curve of shrinking beads, down under the water and up again behind her
      var curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0.3, 0), new THREE.Vector3(-0.06, 0.1, 0), new THREE.Vector3(-0.24, 0.0, 0),
        new THREE.Vector3(-0.46, 0.03, 0), new THREE.Vector3(-0.62, 0.12, 0), new THREE.Vector3(-0.76, 0.2, 0)]);
      var beads = 30;
      for (var b = 0; b < beads; b++) {
        var p = curve.getPoint(b / (beads - 1));
        put(new THREE.SphereGeometry(0.135 - b * 0.0032, 14, 10), tail, p.x, p.y, p.z);
      }
      // the fin, which flicks
      var fin = new THREE.Group();
      var end = curve.getPoint(1);
      fin.position.copy(end);
      var fluke = new THREE.Mesh(finGeo, mat(TAIL[(i * 7 + 2) % TAIL.length], 0.5));
      // lie flat, lobes pointing back: the shape's width goes sideways and its length goes backwards
      fluke.setRotationFromMatrix(new THREE.Matrix4().makeBasis(
        new THREE.Vector3(0, 0, 1), new THREE.Vector3(-1, 0, 0), new THREE.Vector3(0, 1, 0)));
      fin.rotation.order = 'YXZ';
      fluke.castShadow = true;
      fluke.add(new THREE.LineSegments(new THREE.EdgesGeometry(finGeo, 40), new THREE.LineBasicMaterial({color: C.hi, transparent: true, opacity: 0.6})));
      fin.add(fluke);
      rig.add(fin);
      // a lit band at the waist, where the tail begins
      var band = new THREE.Mesh(new THREE.TorusGeometry(0.135, 0.022, 8, 24), aquaMat);
      band.rotation.x = Math.PI / 2;
      band.position.y = 0.3;
      rig.add(band);
      // body, top, head, eyes, hair, arms
      put(new THREE.CylinderGeometry(0.115, 0.1, 0.3, 16), skin, 0, 0.45, 0);
      put(new THREE.SphereGeometry(0.115, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), skin, 0, 0.6, 0);
      put(new THREE.CylinderGeometry(0.122, 0.118, 0.08, 16), mat(C.accent, 0.25), 0, 0.53, 0);
      put(new THREE.CylinderGeometry(0.05, 0.06, 0.08, 10), skin, 0, 0.66, 0);
      put(new THREE.SphereGeometry(0.15, 18, 14), skin, 0, 0.77, 0);
      [-1, 1].forEach(function (s) { put(new THREE.SphereGeometry(0.024, 8, 6), eyeMat, 0.137, 0.79, s * 0.05); });
      put(new THREE.SphereGeometry(0.162, 18, 14), hair, -0.065, 0.81, 0);
      var back = put(new THREE.SphereGeometry(1, 16, 12), hair, -0.11, 0.63, 0);
      back.scale.set(0.1, 0.27, 0.15);
      back.rotation.z = 0.2;
      put(new THREE.SphereGeometry(0.03, 8, 6), new THREE.MeshBasicMaterial({color: C.accent2}), -0.07, 0.94, 0.13);
      var arms = [-1, 1].map(function (s) {
        var arm = new THREE.Group();
        arm.position.set(0, 0.58, s * 0.125);
        put(new THREE.CylinderGeometry(0.03, 0.026, 0.3, 8), skin, 0, -0.14, 0, arm);
        put(new THREE.SphereGeometry(0.032, 8, 6), skin, 0, -0.29, 0, arm);
        arm.rotation.x = s * 0.45;
        rig.add(arm);
        return arm;
      });
      rig.scale.setScalar(1.6);
      g.userData.rig = {group: rig, fin: fin, arms: arms, flick: 0, phase: i * 1.7};
      return g;
    }

    function idle(t, now, dt) {
      var r = t.userData.rig;
      r.group.position.y = Math.sin(now / 700 + r.phase) * 0.04;
      r.flick = Math.max(0, r.flick - dt * 2.5);
      r.fin.rotation.z = 0.35 + Math.sin(now / 380 + r.phase) * 0.25 + r.flick * Math.sin(now / 50) * 0.7;

  const padCenter = (side) => U.clone().multiplyScalar(side === 0 ? -PADX : PADX);

  // ---------- The kit: what a theme may use to build things and effects
  const edgeMat = new THREE.LineBasicMaterial({color: C.accent, transparent: true, opacity: 0.55});
  const withEdges = (mesh, mat = edgeMat) => {
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 28), mat));
    mesh.castShadow = true;
    return mesh;
  };
  const parts = [];
  const partGeo = new THREE.BoxGeometry(0.09, 0.09, 0.09);
  function burst(pos, n, colors, speed = 4, opts = {}) {
    n = reduced ? Math.ceil(n / 3) : n;
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(opts.geo || partGeo, new THREE.MeshBasicMaterial({color: colors[i % colors.length], transparent: true}));
      m.position.copy(pos);
      const a = Math.random() * Math.PI * 2, up = (opts.up || 1.5) + Math.random() * (opts.upRand || 3);
      m.userData = {v: new THREE.Vector3(Math.cos(a) * speed * Math.random(), up, Math.sin(a) * speed * Math.random()),
        life: 1, fade: opts.fade || 0.8, gravity: opts.gravity || 9,
        spin: new THREE.Vector3(Math.random() * 8, Math.random() * 8, Math.random() * 8)};
      scene.add(m);
      parts.push(m);
    }
  }
  // Things in flight: shells, water drops. Each lands on the ground and calls onLand.
  const flying = [];
  function launch(mesh, v, opts = {}) {
    mesh.userData = {v, life: opts.life || 1.2, gravity: opts.gravity || 6, onLand: opts.onLand};
    scene.add(mesh);
    flying.push(mesh);
  }
  // A ring that grows and fades on the ground: a ripple, a shock wave.
  const rings = [];
  function ring(pos, color, size = 1) {
    const m = new THREE.Mesh(new THREE.RingGeometry(0.15, 0.22, 32),
      new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false}));
    m.rotation.x = -Math.PI / 2;
    m.position.copy(pos).setY(pos.y + 0.02);
    m.userData = {life: 1, size};
    scene.add(m);
    rings.push(m);
  }
  let shake = 0;
  function flash(pos, intensity = 3) {
    flashLight.position.copy(pos).add(new THREE.Vector3(0, 1, 0));
    flashLight.intensity = intensity;
  }

  // ---------- Sound: made in the page, after the first tap
  let actx = null;
  const audio = () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; } return actx; };
  function noise({len = 0.5, freq = 900, type = 'lowpass', q = 1, gain = 0.5, power = 2.5} = {}) {
    const c = audio(); if (!c) return;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * len), c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, power);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.value = gain;
    src.connect(f).connect(g).connect(c.destination); src.start();
  }
  function tone({type = 'square', f1 = 220, f2 = 440, len = 0.14, gain = 0.08} = {}) {
    const c = audio(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, c.currentTime); o.frequency.exponentialRampToValueAtTime(f2, c.currentTime + len);
    g.gain.setValueAtTime(gain, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + len);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + len);
  }
  const cheer = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone({type: T.chime || 'square', f1: f, f2: f * 1.01, len: 0.18}), i * 110));

  const kit = {THREE, U, V, padCenter, C, reduced, withEdges, burst, launch, ring, flash, noise, tone,
    shake: (a) => { if (!reduced) shake = Math.max(shake, a); }};
  const look = T.build(THREE, kit);

  // The two pads.
  const grounds = [0, 1].map((side) => {
    const g = look.ground(side);
    g.position.copy(padCenter(side));
    scene.add(g);
    return g;
  });

  // ---------- State: the things on each side, in order
  const sides = [[], []];
  const leaving = [];
  let made = 0;
  let stars = 0;
  let task = null;
  let solvedAt = 0;

  const faceAngle = (side) => {
    if (!look.faceEachOther) return 0;
    const d = side === 0 ? U : U.clone().negate();
    return Math.atan2(-d.z, d.x);
  };
  function slot(side, i) {
    const col = i % 2, row = Math.floor(i / 2);
    return padCenter(side).add(new THREE.Vector3(col ? 0.8 : -0.8, 0, -2.3 + row * 1.15));
  }
  function relayout() {
    sides.forEach((list, side) => list.forEach((t, i) => {
      t.userData.side = side; t.userData.target.copy(slot(side, i)); t.userData.facing = faceAngle(side);
    }));
  }

  function make(side) {
    const t = look.make(made++);
    // An invisible box around the thing, so a small finger can grab it.
    const box = new THREE.Box3().setFromObject(t), size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
    const hit = new THREE.Mesh(new THREE.BoxGeometry(Math.max(size.x, 0.9), Math.max(size.y, 0.6), Math.max(size.z, 0.9)));
    hit.position.copy(mid);
    hit.visible = false;
    t.add(hit);
    Object.assign(t.userData, {side, target: new THREE.Vector3(), lift: 0, facing: faceAngle(side)});
    t.rotation.y = t.userData.facing;
    t.traverse((o) => { o.userData.thing = t; });
    return t;
  }
  function addThing(side, from) {
    if (sides[side].length >= MAX) { tell('full'); return null; }
    const t = make(side);
    sides[side].push(t);
    relayout();
    t.position.copy(from || t.userData.target.clone().add(look.enterFrom ? look.enterFrom(side) : new THREE.Vector3(-4, 0, 0)));
    scene.add(t);
    return t;
  }
  function fill(side, n) {
    while (sides[side].length > n) { const t = sides[side].pop(); scene.remove(t); }
    while (sides[side].length < n) addThing(side);
    relayout();
  }

  // ---------- Voice: one line at a time, Lauren's clip if there is one, else the browser's voice
  let muted = false;
  try { muted = localStorage.getItem('maths-voice') === 'off'; } catch (e) { /* storage blocked: voice stays on */ }
  let queue = [], playing = null, heard = false;
  function stopVoice() {
    queue = [];
    if (playing && playing.pause) playing.pause();
    if (window.speechSynthesis) speechSynthesis.cancel();
    playing = null;
    reading = null;
  }
  function speak(lines, interrupt = true) {
    if (interrupt) stopVoice();
    if (muted) return;
    queue.push(...lines);
    if (!playing) playNext();
  }
  function playNext() {
    const l = queue.shift();
    if (!l) { playing = null; reading = null; light(99); restTimer = setTimeout(rest, 1200); return; }
    const done = () => { if (playing === p) playNext(); };
    let p;
    clearTimeout(restTimer);
    if (Object.prototype.hasOwnProperty.call(CLIPS, l.clip)) {
      p = new Audio(`voice/${l.clip}.mp3`);
      read(l, p, CLIPS[l.clip]);
      p.onended = done;
      p.onerror = () => { if (playing === p) { playing = null; queue.unshift(Object.assign({}, l, {clip: ''})); playNext(); } };
      playing = p;
      p.play().catch(() => { if (playing === p) playing = null; });
    } else if (window.speechSynthesis) {
      p = new SpeechSynthesisUtterance(l.speak);
      p.rate = 0.95;
      p.onend = done;
      read(l, p, null);
      // The browser's voice says where each word starts.
      p.onboundary = (e) => { if (e.name === 'word' && reading && reading.p === p) light(wordAt(l.speak, e.charIndex)); };
      playing = p;
      speechSynthesis.speak(p);
    }
  }
  $('mute').onclick = () => {
    muted = !muted;
    try { localStorage.setItem('maths-voice', muted ? 'off' : 'on'); } catch (e) { /* not kept */ }
    $('mute').textContent = muted ? '🔇' : '🔊';
    $('mute').setAttribute('aria-label', muted ? 'Voice off' : 'Voice on');
    if (muted) { stopVoice(); rest(); } else speak([task.line]);
  };
  $('mute').textContent = muted ? '🔇' : '🔊';

  // ---------- The words line: what is being said, one word lit at a time; at rest, the sum in words
  let reading = null, restTimer = 0, lit = -1;
  function setWords(text, resting) {
    const el = $('words');
    el.classList.toggle('resting', resting);
    el.replaceChildren(...text.split(/\s+/).filter(Boolean).map((w) => {
      const s = document.createElement('span');
      s.textContent = w;
      return s;
    }));
    lit = -1;
  }
  function read(l, p, times) {
    reading = {l, p, times};
    setWords(l.speak, false);
  }
  function light(i) {
    if (i === lit) return;
    lit = i;
    [...$('words').children].forEach((s, j) => {
      s.classList.toggle('now', j === i);
      s.classList.toggle('said', j < i);
    });
  }
  const wordAt = (text, at) => text.slice(0, at).split(/\s+/).filter(Boolean).length - (/\S$/.test(text.slice(0, at)) ? 1 : 0);
  // Called each frame: light the word Lauren is saying now.
  function follow() {
    if (!reading || !reading.times || !reading.times.length) return;
    const t = reading.p.currentTime, w = reading.times;
    let i = -1;
    for (let j = 0; j < w.length; j++) if (t >= w[j][0] - 0.03) i = j;
    if (reading.p.ended) i = w.length;
    light(i);
  }
  function rest() {
    if (reading) return;
    const L = sides[0].length, R = sides[1].length;
    setWords(line('sum', {L, R, S: L + R}).speak, true);
  }

  // ---------- Words on screen, and spoken
  const line = (key, vars, i) => W.line(T, key, vars, i);
  let sayTimer = 0;
  function show(text, ms = 2600) {
    $('say').textContent = text;
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => { $('say').textContent = ''; }, ms);
  }
  function tell(key, vars, ms) { const l = line(key, vars); show(l.show, ms); speak([l]); }

  // After the counts stop changing, the voice reads out the sum. Taking away is read as taking away.
  let settled = [0, 0], settleTimer = 0, quiet = false, justWon = false;
  function changed() {
    clearTimeout(settleTimer);
    if (quiet) return;
    settleTimer = setTimeout(readOut, 1100);
  }
  function readOut() {
    const L = sides[0].length, R = sides[1].length;
    const was = settled;
    settled = [L, R];
    if (justWon) { justWon = false; return; }
    const dL = L - was[0], dR = R - was[1];
    if (dL < 0 && dR === 0) speak([line('takeAway', {a: was[0], k: -dL, b: L})]);
    else if (dR < 0 && dL === 0) speak([line('takeAway', {a: was[1], k: -dR, b: R})]);
    else if (dL !== 0 || dR !== 0) speak([line('sum', {L, R, S: L + R})]);
  }

  function updateHud() {
    const L = sides[0].length, R = sides[1].length;
    $('sum').innerHTML = `${L} <span class="op">+</span> ${R} <span class="op">=</span> ${L + R}`;
    $('countL').textContent = L;
    $('countR').textContent = R;
    const rel = $('rel');
    rel.textContent = L === R ? '=' : L > R ? '>' : '<';
    rel.classList.toggle('equal', L === R);
    $('stars').textContent = `★ ${stars}`;
    checkTask();
    changed();
    if (!reading) rest();
  }

  // ---------- Challenges: easy questions answered by adding, taking away and moving things
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (r) => rnd(r[0], r[1]);
  const RG = W.RANGES;
  const TASKS = [
    () => ({line: line('taskEqual'), ok: (L, R) => L === R && L > 0, win: (L) => line('same', {n: L})}),
    () => { const n = pick(RG.build); return {line: line('taskBuild', {n}), ok: (L) => L === n, win: () => line('count', {n})}; },
    () => { const a = pick(RG.show), b = pick(RG.show); return {line: line('taskShow', {a, b}), ok: (L, R) => L === a && R === b,
      win: () => line('sum', {L: a, R: b, S: a + b})}; },
    () => { const t = pick(RG.total); return {line: line('taskTotal', {t}), ok: (L, R) => L + R === t, win: (L, R) => line('sum', {L, R, S: t})}; },
    () => { const n = pick(RG.keep); return {line: line('taskKeep', {n}), setup: () => fill(1, n + rnd(2, 4)), ok: (L, R) => R === n,
      win: () => line('only', {n})}; },
    () => ({line: line('taskBigger'), ok: (L, R) => R > L, win: (L, R) => line('bigger', {L, R})}),
  ];
  function newTask(first = false) {
    let next;
    do { next = TASKS[rnd(0, TASKS.length - 1)](); } while (!first && task && next.line.show === task.line.show);
    task = first ? TASKS[0]() : next;
    solvedAt = 0;
    quiet = true;
    if (task.setup) task.setup();
    quiet = false;
    settled = [sides[0].length, sides[1].length];
    $('task').textContent = task.line.show;
    $('task').classList.remove('done');
    updateHud();
    clearTimeout(settleTimer);
    justWon = false;
    if (!first || heard) speak([task.line]);
  }
  function checkTask() {
    if (!task || solvedAt) return;
    const L = sides[0].length, R = sides[1].length;
    if (task.ok(L, R)) {
      solvedAt = performance.now();
      stars++;
      const win = task.win(L, R), yes = line('yes', {}, stars - 1);
      $('stars').textContent = `★ ${stars}`;
      $('task').textContent = `${yes.show} ${win.show}`;
      $('task').classList.add('done');
      show(line('next').show, 4000);
      speak([yes, win, line('next')]);
      justWon = true;
      cheer();
      [0, 1].forEach((s) => burst(padCenter(s).add(new THREE.Vector3(0, 1.2, 0)), 40, [C.accent, C.accent2, C.warn, C.hi], 5));
    }
  }
  // Tap the challenge to hear it again.
  $('task').onclick = () => { audio(); heard = true; speak([solvedAt ? line('next') : task.line]); };

  // ---------- Input: tap to take one away, drag to move
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  let drag = null;
  function aim(e) {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
  }
  // The first tap anywhere starts sound, and says the first challenge out loud.
  function firstTap() {
    audio();
    if (!heard) { heard = true; if (!solvedAt) speak([task.line]); }
  }
  document.addEventListener('pointerdown', firstTap, {capture: true});
  renderer.domElement.addEventListener('pointerdown', (e) => {
    aim(e);
    const hit = ray.intersectObjects(sides.flat(), true)[0];
    if (!hit) return;
    const t = hit.object.userData.thing;
    drag = {t, x: e.clientX, y: e.clientY, moved: false, from: t.userData.side};
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener('pointermove', (e) => {
    aim(e);
    if (!drag) {
      const hit = ray.intersectObjects(sides.flat(), true)[0];
      renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
      return;
    }
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.moved = true;
    const p = new THREE.Vector3();
    if (ray.ray.intersectPlane(ground, p)) { drag.t.userData.target.copy(p); drag.t.userData.lift = 0.7; drag.at = p.clone(); }
  });
  renderer.domElement.addEventListener('pointerup', () => {
    if (!drag) return;
    const {t, moved, from, at} = drag;
    drag = null;
    t.userData.lift = 0;
    if (!moved) { takeAway(t); return; }
    const to = (at || t.position).dot(U) < 0 ? 0 : 1;
    if (to !== from && sides[to].length < MAX) {
      const L0 = sides[0].length, R0 = sides[1].length;
      sides[from].splice(sides[from].indexOf(t), 1);
      sides[to].push(t);
      relayout();
      const L = sides[0].length, R = sides[1].length;
      show(`${L0} + ${R0} = ${L} + ${R}. Still ${L + R} ${L + R === 1 ? T.one : T.many}!`, 3200);
      if (look.sounds.move) look.sounds.move();
    } else {
      relayout();
    }
    updateHud();
  });

  function takeAway(t) {
    const side = t.userData.side, before = sides[side].length;
    sides[side].splice(sides[side].indexOf(t), 1);
    const leave = look.remove(t, side);
    if (leave && leave.dur > 0) leaving.push({t, leave, p: 0});
    else scene.remove(t);
    look.sounds.remove();
    relayout();
    show(line('takeAway', {a: before, k: 1, b: before - 1}).show);
    updateHud();
  }

  function add(side) {
    const before = sides[side].length;
    if (addThing(side)) { look.sounds.add(); show(line('sum', {L: before, R: 1, S: before + 1}).show); updateHud(); }
  }

  function act() {
    const all = sides.flat();
    if (!all.length) { tell('empty'); return; }
    all.forEach((t, i) => setTimeout(() => { if (t.parent) look.act(t, t.userData.side); }, i * 90));
    tell('act');
  }

  $('addL').onclick = () => add(0);
  $('addR').onclick = () => add(1);
  $('act').onclick = act;
  $('next').onclick = () => newTask();
  $('clear').onclick = () => { quiet = true; fill(0, 0); fill(1, 0); quiet = false; settled = [0, 0]; updateHud(); clearTimeout(settleTimer); tell('clear'); };

  // ---------- Resize: keep both pads in view at any width
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    const aspect = w / h;
    // Both pads must fit across: a phone held upright needs more room on each side.
    const needW = aspect < 0.9 ? 7.4 : 6.4;
    let halfH = 4.3;
    if (halfH * aspect < needW) halfH = needW / aspect;
    Object.assign(camera, {left: -halfH * aspect, right: halfH * aspect, top: halfH + 1.1, bottom: -halfH + 0.3});
    // ?zoom=3 shows a close-up of the left pad, for designing a theme.
    const zoom = Number(new URLSearchParams(location.search).get('zoom')) || 1;
    if (zoom > 1) { camera.zoom = zoom; camera.lookAt(padCenter(0).add(new THREE.Vector3(0, 0.4, 0))); }
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // ---------- The loop
  const tmp = new THREE.Vector3();
  function place(el, worldPos) {
    tmp.copy(worldPos).project(camera);
    el.style.left = `${((tmp.x + 1) / 2) * stage.clientWidth}px`;
    el.style.top = `${((1 - tmp.y) / 2) * stage.clientHeight}px`;
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    sides.flat().forEach((t) => {
      const ud = t.userData;
      const goal = tmp.copy(ud.target); goal.y = ud.lift || 0;
      t.position.lerp(goal, 1 - Math.pow(0.0008, dt));
      let turn = ud.facing - t.rotation.y;
      turn = Math.atan2(Math.sin(turn), Math.cos(turn));
      t.rotation.y += turn * (1 - Math.pow(0.002, dt));
      look.idle(t, now, dt);
    });
    for (let i = leaving.length - 1; i >= 0; i--) {
      const l = leaving[i];
      l.p = Math.min(1, l.p + dt / l.leave.dur);
      l.leave.step(l.p, dt);
      if (l.p >= 1) { scene.remove(l.t); leaving.splice(i, 1); }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const m = parts[i], u = m.userData;
      u.v.y -= u.gravity * dt; m.position.addScaledVector(u.v, dt);
      if (m.position.y < 0.05) { m.position.y = 0.05; u.v.multiplyScalar(0.4); u.v.y = Math.abs(u.v.y) * 0.3; }
      m.rotation.x += u.spin.x * dt; m.rotation.y += u.spin.y * dt;
      u.life -= dt * u.fade; m.material.opacity = Math.max(0, u.life);
      if (u.life <= 0) { scene.remove(m); m.material.dispose(); parts.splice(i, 1); }
    }
    for (let i = flying.length - 1; i >= 0; i--) {
      const s = flying[i], u = s.userData;
      u.v.y -= u.gravity * dt; s.position.addScaledVector(u.v, dt); u.life -= dt;
      if (s.position.y <= 0.05 || u.life <= 0) {
        if (u.onLand) u.onLand(s.position.clone().setY(0.05));
        scene.remove(s); flying.splice(i, 1);
      }
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const m = rings[i], u = m.userData;
      u.life -= dt * 1.3;
      const s = 1 + (1 - u.life) * 5 * u.size;
      m.scale.set(s, s, s);
      m.material.opacity = Math.max(0, u.life) * 0.9;
      if (u.life <= 0) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); rings.splice(i, 1); }
    }
    if (look.groundIdle) grounds.forEach((g, side) => look.groundIdle(g, now, side));
    flashLight.intensity = Math.max(0, flashLight.intensity - dt * 9);
    shake = Math.max(0, shake - dt * 1.2);
    camera.position.set(20 + (Math.random() - 0.5) * shake, 20 + (Math.random() - 0.5) * shake, 20);
    follow();
    renderer.render(scene, camera);
    place($('countL'), padCenter(0).add(new THREE.Vector3(-1.9, 1.0, -3.1)));
    place($('countR'), padCenter(1).add(new THREE.Vector3(-1.9, 1.0, -3.1)));
    place($('rel'), new THREE.Vector3(-1.9, 1.0, -3.1));
    requestAnimationFrame(frame);
  }

  // ---------- Start: 3 on the left and 2 on the right, so the first view already shows a sum
  quiet = true;
  fill(0, 3); fill(1, 2);
  quiet = false;
  sides.flat().forEach((t) => t.position.copy(t.userData.target));
  newTask(true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
